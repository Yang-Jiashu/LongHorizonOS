name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  platform-compatibility:
    name: Platform compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Cross-platform audits
        run: >
          python -m pytest -q
          tests/unit
          tests/integration
          tests/e2e
          tests/agent_os/test_audit_sigkill.py
          tests/agent_os/artifacts/test_audit_benchmark.py
          tests/agent_os/artifacts/test_audit_demo_independence.py
          tests/agent_os/artifacts/test_audit_public_claims.py
          --cov=lhos
          --cov-report=term-missing:skip-covered

  quick:
    name: Fast checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Lint
        run: |
          python -m ruff check src/lhos tests/
      - name: Format
        run: python -m ruff format --check src/lhos examples/ tests/
      - name: Typecheck
        run: python -m mypy src/lhos

  core-correctness:
    name: Core correctness (Agent OS, D1, D2, D3, SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install ".[dev]"
      - name: Agent OS
        run: python -m pytest tests/agent_os -q
      - name: D1 VPG
        run: python -m pytest tests/runtimes/verified_progress -q -m "not slow"
      - name: D2
        run: python -m pytest tests/runtimes/multi_agent -q
        # NOTE: core correctness jobs HARD-FAIL; no retries/allow-failure.

  product-surface:
    name: SDK / CLI / demos / benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install ".[dev]"
      - name: SDK / CLI / demo / bench
        run: |
          python -m pytest tests/sdk -q
          python -m pytest tests/cli -q
          python -m pytest tests/demo -q
          python -m pytest tests/benchmarks -q

  fresh-wheel-smoke:
    name: Fresh wheel outside repo (killer demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: pip install build && python -m build
      - name: Fresh install + outside-repo smoke
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl pydantic pyyaml networkx
          cd /tmp
          /tmp/smoke/bin/lhos --help
          /tmp/smoke/bin/lhos demo recovery-repair

  quick-benchmark:
    name: Quick semantic-repair benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install ".[dev]"
      - name: Quick benchmark
        run: lhos benchmark semantic-repair --quick
    # schedule/opt-in: benchmark-quick is ~90s; full only on scheduled/release.
