      <path d="M 43 20 A 23 23 0 0 1 70 52 L 43 43 Z" fill="#4A7DBF" opacity="0.8"/>
    </g>
    <g transform="translate(180, 42)">
      <text font-family="Helvetica Neue, Inter, Arial Black, sans-serif" font-size="90" font-weight="900" fill="url(#g2)" letter-spacing="-2">22/27<tspan font-size="38" fill="#6B8DD6"> 81%</tspan></text>
      <text y="116" font-family="Helvetica Neue, Inter, Arial Black, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">至少一臂有得分</text>
      <text y="160" font-family="Helvetica Neue, Inter, Arial, sans-serif" font-size="24" fill="#a8b8d8">剔除 15 个 0-0 双零平局 · 有效对 27 / 42</text>
    </g>
  </g>
  <!-- Card2 bottom=700 -->

  <!-- ============ 卡3 ~2.4x purple H=238 y=716 ============ -->
