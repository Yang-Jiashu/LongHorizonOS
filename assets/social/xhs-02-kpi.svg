      <text y="44" font-family="Helvetica Neue, Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">
        <tspan fill="#FFB36B">LHTB = LongHorizonBenchmark</tspan> · <tspan fill="#6B8DD6">DeepSeek Harness</tspan> · StepFun
      </text>
      <text y="78" font-family="Helvetica Neue, Inter, Arial, sans-serif" font-size="22" fill="#98a8c8">README 致谢列名 + 锚点</text>
    </g>
  </g>
  <!-- Card5 bottom=1350 -->

  <!-- ============ 卡6 HONEST H=76 y=1360 (再砍! 只剩标题+行 小字22) ============ -->
  <g transform="translate(70, 1360)" filter="url(#s2)">
    <rect width="940" height="76" rx="20" fill="#1a0d0a" stroke="#FF8A3D" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="76" rx="5" fill="url(#g4)"/>
    <g transform="translate(50, 16)">
      <rect width="46" height="46" rx="10" fill="#2a0e0a" stroke="#FF8A3D" stroke-opacity="0.6"/>
      <polygon points="23,6 40,40 6,40" fill="none" stroke="#FF8A3D" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <g transform="translate(128, 18)">
      <text font-family="Helvetica Neue, Inter, Arial Black, sans-serif" font-size="22" font-weight="900" fill="#FF8A3D" letter-spacing="0.8">HONEST · 诚实披露</text>
      <text y="40" font-family="Helvetica Neue, Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#ecc8c0">
