      <text x="116" y="68" font-family="Helvetica Neue, Inter, Arial Black, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">行 harness 代码改动</text>
      <text y="124" font-family="Helvetica Neue, Inter, Arial, sans-serif" font-size="24" fill="#e0b898">包住就能用 · Harness / Model / Task 不变</text>
      <text y="162" font-family="Helvetica Neue, Inter, Arial, sans-serif" font-size="22" fill="#c89878">外层是操作系统不是补丁 · Agent 一行不改</text>
    </g>
  </g>
  <!-- Card4 bottom=1208 -->

  <!-- ============ 卡5 CITATION H=126 y=1224 (小卡再砍) ============ -->
  <g transform="translate(70, 1224)" filter="url(#s2)">
    <rect width="940" height="126" rx="22" fill="#0d1526" stroke="#587BE8" stroke-opacity="0.65" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="126" rx="5" fill="url(#g2)"/>
    <g transform="translate(50, 28)">
