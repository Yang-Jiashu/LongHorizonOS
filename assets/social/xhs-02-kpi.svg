      <path d="M 20 24 Q 35 10 50 24 L 50 44 Q 35 58 20 44 Z" fill="none" stroke="#587BE8" stroke-width="4.5" stroke-linejoin="round"/>
    </g>
    <g transform="translate(152, 24)">
