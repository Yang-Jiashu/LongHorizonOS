      <text y="118" font-family="Helvetica Neue, Inter, Arial Black, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">input token 节省</text>
      <text y="162" font-family="Helvetica Neue, Inter, Arial, sans-serif" font-size="24" fill="#b8a8e0">重启只带三件套 · 100K 废话不带 · 中位数差值</text>
    </g>
  </g>
  <!-- Card3 bottom=954 -->

  <!-- ============ 卡4 0 harness orange H=238 y=970 ============ -->
  <g transform="translate(70, 970)" filter="url(#s2)">
    <rect width="940" height="238" rx="24" fill="#1a100c" stroke="#FF5A1F" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="238" rx="5" fill="url(#g4)"/>
    <g transform="translate(54, 68)">
      <rect width="86" height="86" rx="18" fill="#200a0a" stroke="#FF5A1F" stroke-opacity="0.55"/>
      <path d="M 14 46 L 72 46 M 43 16 L 43 76" stroke="#FF5A1F" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(180, 42)">
