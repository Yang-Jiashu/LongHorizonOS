<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#060b14"/><stop offset="100%" stop-color="#0a0d14"/></linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1FAA59"/><stop offset="100%" stop-color="#3DD68F"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4A7DBF"/><stop offset="100%" stop-color="#6B8DD6"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7B5BF2"/><stop offset="100%" stop-color="#8957e5"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF8A3D"/><stop offset="100%" stop-color="#FF5A1F"/></linearGradient>
    <filter id="s2"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>
  <rect width="1080" height="1440" fill="url(#bg2)"/>

  <!-- ===================== 严格规范 =====================
       双列网格:
         左列 ICON 区: x=54~140 (w=86), 每张卡内部 y=卡顶+56 (cy=99)
         右列内容区: x=180~900 (w=720), 行基线严格:
           L1 大数字   y = 卡内 56, 顶对齐卡上沿 40
           L2 小标题   y = L1 底 + 16    (大字100px高 → y≈152)
           L3 说明1行  y = L2 底 + 12    (y≈194)
       每张卡 H=238 统一! 卡间 gap=16 统一!
       Card y: 208 / 462 / 716 / 970 / 1224 / 1340
  ====================================================== -->

  <g transform="translate(70, 72)">
    <text font-family="Helvetica Neue, Inter, Arial Black, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF">46 个真实任务 · 配对实测</text>
    <text y="66" font-family="Helvetica Neue, Inter, Arial, sans-serif" font-size="24" fill="#a0a0b0">PAIRED A/B · 同模型 stepfun/step-3.7-flash · 同任务 · 同预算</text>
  </g>
  <!-- Title bottom=72+66+24=162; Card1 y=208 → gap 46 OK -->

  <!-- ============ 卡1 37/42 green H=238 y=208 ============ -->
  <g transform="translate(70, 208)" filter="url(#s2)">
    <rect width="940" height="238" rx="24" fill="#0d1b14" stroke="#1FAA59" stroke-opacity="0.65" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="238" rx="5" fill="url(#g1)"/>
    <!-- 左列 ICON 统一 86x86 @x54 y=56 -->
    <g transform="translate(54, 68)">
      <rect width="86" height="86" rx="18" fill="#0d2018" stroke="#1FAA59" stroke-opacity="0.55"/>
      <path d="M 18 44 L 36 60 L 68 24" fill="none" stroke="#1FAA59" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- 右列 x=180, 严格3行基线 -->
    <g transform="translate(180, 42)">
      <text font-family="Helvetica Neue, Inter, Arial Black, sans-serif" font-size="96" font-weight="900" fill="url(#g1)" letter-spacing="-3">37/42</text>
      <text y="118" font-family="Helvetica Neue, Inter, Arial Black, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">reward 持平或更优</text>
      <text y="162" font-family="Helvetica Neue, Inter, Arial, sans-serif" font-size="24" fill="#b0d0b8">有效分母 42 = 46 总 − 3 无结果 − 1 不合法配对</text>
    </g>
  </g>
  <!-- Card1 bottom=446 -->

  <!-- ============ 卡2 22/27 blue H=238 y=462 ============ -->
  <g transform="translate(70, 462)" filter="url(#s2)">
    <rect width="940" height="238" rx="24" fill="#0d1525" stroke="#4A7DBF" stroke-opacity="0.65" stroke-width="1.5"/>
