<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09101f"/><stop offset="100%" stop-color="#0b0e16"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3A7BD5"/><stop offset="100%" stop-color="#587BE8"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2ea043"/><stop offset="100%" stop-color="#1FAA59"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF8A3D"/><stop offset="100%" stop-color="#FF5A1F"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1FAA59"/><stop offset="100%" stop-color="#3DD68F"/></linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7B5BF2"/><stop offset="100%" stop-color="#8957e5"/></linearGradient>
    <filter id="s3"><feDropShadow dx="0" dy="3" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>
  <rect width="1080" height="1440" fill="url(#bg3)"/>
  <g transform="translate(70, 72)">
    <text font-family="Helvetica Neue, Inter, Arial Black, sans-serif"
          font-size="54" font-weight="900" fill="#FFFFFF">抄了操作系统 50 年的作业</text>
    <text y="62" font-family="Helvetica Neue, Inter, Arial, sans-serif"
          font-size="22" fill="#9898a5">把 Agent Runtime 当进程管 · 6 个核心闸门 · 全部 fail-closed</text>
  </g>
  <!-- 通用宏: 每卡 940×160 gap 20.
       内容: 左彩条 8px + 图标容器 76×76 @ x=48, y=42
               → 内容文字 translate x=158, y=42
       最后一行 baseline 到卡底 = 160 - (42 + last y)
       每卡 H=160, y 递增 180 = 160 + 20 gap -->
  <!-- 1 Time Quantum y=156 H=160 bottom=316 -->
  <g transform="translate(70, 156)" filter="url(#s3)">
    <rect width="940" height="160" rx="18" fill="#142130" stroke="#3A7BD5" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="160" rx="4" fill="url(#g1)"/>
    <g transform="translate(48, 42)">
      <rect width="76" height="76" rx="16" fill="#0f1a28" stroke="#3A7BD5" stroke-opacity="0.5"/>
      <circle cx="38" cy="38" r="26" fill="none" stroke="#3A7BD5" stroke-width="4" opacity="0.5"/>
      <path d="M 38 38 L 38 14 A 22 22 0 0 1 58 44 L 38 38 Z" fill="#3A7BD5" opacity="0.7"/>
      <line x1="38" y1="38" x2="38" y2="18" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="38" y1="38" x2="52" y2="44" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(158, 42)">
      <text font-family="Helvetica Neue, Inter, Arial Black, sans-serif"
            font-size="26" font-weight="900" fill="#FFFFFF">时间片 · Time Quantum</text>
      <text y="38" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="18" font-weight="700" fill="#a8c0d8">有界执行切片 · 漂移的运行, 最多再瞎跑一个切片就被抓</text>
      <text y="68" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="15" fill="#8098b0">8K token 单次续跑上限 · 漂移检测 = 上下文增量中位数 vs 上次续跑点 · 2 触发</text>
      <text y="90" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="15" fill="#8098b0">每个 slice 出结果前都过投资闸门 · 白烧的 slice 直接被 OOM 杀</text>
    </g>
  </g>
  <!-- 2 Context Switch y=336 H=160 bottom=496 -->
  <g transform="translate(70, 336)" filter="url(#s3)">
    <rect width="940" height="160" rx="18" fill="#142820" stroke="#2ea043" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="160" rx="4" fill="url(#g2)"/>
    <g transform="translate(48, 42)">
      <rect width="76" height="76" rx="16" fill="#0f2018" stroke="#2ea043" stroke-opacity="0.5"/>
      <path d="M 20 28 L 40 38 L 20 48" fill="none" stroke="#2ea043" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 56 28 L 36 38 L 56 48" fill="none" stroke="#2ea043" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="38" cy="38" r="10" fill="none" stroke="#2ea043" stroke-width="3.5"/>
    </g>
    <g transform="translate(158, 42)">
      <text font-family="Helvetica Neue, Inter, Arial Black, sans-serif"
            font-size="26" font-weight="900" fill="#FFFFFF">语义切换 · Context Switch</text>
      <text y="38" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="18" font-weight="700" fill="#a8d8b8">重启只带三件套 · 目标 URI / 证据 URI / 产物 URI</text>
      <text y="68" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="15" fill="#80a088">100K token 全文废话不带进上下文 · 历史全文扔 versioned page-table</text>
      <text y="90" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="15" fill="#80a088">上下文平均长度砍到 1/3 · reward 没变 · 这就是 ~2.4× token 节省来源</text>
    </g>
  </g>
  <!-- 3 Investment y=516 H=160 bottom=676 -->
  <g transform="translate(70, 516)" filter="url(#s3)">
    <rect width="940" height="160" rx="18" fill="#241810" stroke="#FF8A3D" stroke-opacity="0.75" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="160" rx="4" fill="url(#g3)"/>
    <g transform="translate(48, 42)">
      <rect width="76" height="76" rx="16" fill="#1e140c" stroke="#FF8A3D" stroke-opacity="0.5"/>
      <ellipse cx="38" cy="54" rx="24" ry="9" fill="#FF8A3D" opacity="0.4"/>
      <circle cx="38" cy="52" r="14" fill="none" stroke="#FF8A3D" stroke-width="4"/>
      <path d="M 38 42 L 38 12" stroke="#FF8A3D" stroke-width="5" stroke-linecap="round"/>
      <path d="M 38 12 Q 54 8 58 22 Q 46 20 38 28 Z" fill="#FF8A3D"/>
      <path d="M 38 12 Q 22 8 18 22 Q 30 20 38 28 Z" fill="#FFB36B"/>
    </g>
    <g transform="translate(158, 42)">
      <text font-family="Helvetica Neue, Inter, Arial Black, sans-serif"
            font-size="26" font-weight="900" fill="#FFFFFF">投资而非警报 · Investment-gated</text>
      <text y="38" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="18" font-weight="700" fill="#e8c8a0">重启必须&quot;挣来的&quot; · 能带状态 + 上次重启确实回了本</text>
      <text y="68" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="15" fill="#b09060">restart ROI 跟踪 · 连续 N 次 0 回报的策略直接退役 · 不给机会白烧</text>
      <text y="90" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="15" fill="#b09060">5 个 dropoff 里 3 个是 restart 敏感型 · v2 专门给他们调 ROI 阈值</text>
    </g>
  </g>
  <!-- 4 OOM Killer y=696 H=160 bottom=856 -->
  <g transform="translate(70, 696)" filter="url(#s3)">
    <rect width="940" height="160" rx="18" fill="#281010" stroke="#FF5A1F" stroke-opacity="0.75" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="160" rx="4" fill="url(#g3)"/>
    <g transform="translate(48, 42)">
      <rect width="76" height="76" rx="16" fill="#200a0a" stroke="#FF5A1F" stroke-opacity="0.5"/>
      <polygon points="38,14 62,38 38,62 14,38" fill="#FF5A1F" stroke="#FF8A3D" stroke-width="2"/>
      <line x1="22" y1="22" x2="54" y2="54" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="54" y1="22" x2="22" y2="54" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(158, 42)">
      <text font-family="Helvetica Neue, Inter, Arial Black, sans-serif"
            font-size="26" font-weight="900" fill="#FFFFFF">安全阀 · OOM Killer</text>
      <text y="38" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="18" font-weight="700" fill="#e8b8b0">限速的 severe valve · cache ≥ 4× 软线强制语义重启</text>
      <text y="68" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="15" fill="#c07870">fail-closed · 观测有歧义也执行 kill · 不会振铃震荡 · 杀死后必带回滚</text>
      <text y="90" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="15" fill="#c07870">与 watchdog 双保险 · watchdog 管长时间白烧 · OOM 管瞬时上下文爆炸</text>
    </g>
  </g>
  <!-- 5 Watchdog y=876 H=160 bottom=1036 -->
  <g transform="translate(70, 876)" filter="url(#s3)">
    <rect width="940" height="160" rx="18" fill="#142230" stroke="#1FAA59" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="160" rx="4" fill="url(#g5)"/>
    <g transform="translate(48, 42)">
      <rect width="76" height="76" rx="16" fill="#0f1d20" stroke="#1FAA59" stroke-opacity="0.5"/>
      <circle cx="38" cy="38" r="26" fill="none" stroke="#1FAA59" stroke-width="3" opacity="0.4"/>
      <circle cx="38" cy="38" r="18" fill="none" stroke="#1FAA59" stroke-width="3" opacity="0.4"/>
      <polyline points="12,38 22,38 26,18 32,58 38,18 44,58 50,18 54,38 64,38" fill="none" stroke="#1FAA59" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
