            font-size="26" font-weight="900" fill="#FFFFFF">看门狗 · Watchdog</text>
      <text y="38" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="18" font-weight="700" fill="#a8d0c0">8M token 白烧 + 零写入 + verifier 冻结 → 停机</text>
      <text y="68" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="15" fill="#80a090">任何生命迹象重置计时 · 三类信号 0/1/2 离散阈值 (写入/reward 变动/verifier 回答)</text>
      <text y="90" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="15" fill="#80a090">158 续跑案例就是 watchdog 本该在 32 次续跑就拍死的对象</text>
    </g>
  </g>
  <!-- 6 Page Table y=1056 H=160 bottom=1216 -->
  <g transform="translate(70, 1056)" filter="url(#s3)">
    <rect width="940" height="160" rx="18" fill="#1e1428" stroke="#8957e5" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="160" rx="4" fill="url(#g6)"/>
    <g transform="translate(48, 42)">
      <rect width="76" height="76" rx="16" fill="#181024" stroke="#8957e5" stroke-opacity="0.5"/>
      <rect x="14" y="12" width="48" height="12" rx="3" fill="none" stroke="#8957e5" stroke-width="3"/>
      <rect x="14" y="30" width="48" height="12" rx="3" fill="none" stroke="#8957e5" stroke-width="3"/>
      <rect x="14" y="48" width="48" height="12" rx="3" fill="#8957e5" fill-opacity="0.35" stroke="#8957e5" stroke-width="3"/>
      <rect x="14" y="64" width="48" height="6" rx="3" fill="#8957e5" fill-opacity="0.7"/>
    </g>
    <g transform="translate(158, 42)">
      <text font-family="Helvetica Neue, Inter, Arial Black, sans-serif"
            font-size="26" font-weight="900" fill="#FFFFFF">版本化进度图 · Page Table</text>
      <text y="38" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="18" font-weight="700" fill="#c8b8e8">中途改一个上游文件 · 只让受影响子图失效</text>
      <text y="68" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="15" fill="#9880c0">已验证绝不重做 · 依赖图 topo-sort · 节点 hash 校验 · 带 SHA 重放</text>
      <text y="90" font-family="Helvetica Neue, Inter, Arial, sans-serif"
            font-size="15" fill="#9880c0">46 任务 5772 个节点 · topo 排序 0 冲突 · 重放 100% 一致</text>
    </g>
  </g>
  <!-- footer fail-closed y=1236 H=176 bottom=1412 canvas 1440 → 28 safety -->
  <g transform="translate(70, 1236)">
    <rect width="940" height="176" rx="20" fill="#141826" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
    <g transform="translate(48, 28)">
      <path d="M 44 2 L 82 14 L 82 52 Q 82 74 44 86 Q 6 74 6 52 L 6 14 Z" fill="#FF5A1F" fill-opacity="0.2" stroke="#FF8A3D" stroke-width="3"/>
      <path d="M 28 44 L 40 56 L 62 30" fill="none" stroke="#FF8A3D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(112, 0)">
        <text font-family="Helvetica Neue, Inter, Arial Black, sans-serif"
              font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="0.6">所有闸门 fail-closed · 6 个闸门全部互锁</text>
        <text y="34" font-family="Helvetica Neue, Inter, Arial, sans-serif"
              font-size="17" fill="#d0d4e0">观测有歧义 → 继续跑 · reward 红线是结构性的 · 不是口号</text>
        <text y="60" font-family="Helvetica Neue, Inter, Arial, sans-serif"
              font-size="15" fill="#8a8ea0">任何 single-point-of-fail 都不让 Agent 失控 · 6 闸门独立判决 · 任一触发即进入安全流程</text>
        <text y="84" font-family="Helvetica Neue, Inter, Arial, sans-serif"
              font-size="15" fill="#8a8ea0">这和你见过的 &quot;加个 watch flag 就完了&quot; 完全不是一回事 · 整个外层就是把 Agent 当进程管</text>
        <text y="110" font-family="Helvetica Neue, Inter, Arial Black, sans-serif"
              font-size="17" font-weight="800" fill="#FFB36B">→ 这就是为什么 0 行 harness 改动下, 37/42 reward 还能持平或更优</text>
      </g>
    </g>
  </g>
</svg>
