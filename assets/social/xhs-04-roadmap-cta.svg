       3 peers: y=160/288/416 each H=96 → last baseline 416+52=468. 卡高 544 →  margin 544-468-30(trans 50..)=544-498=46 bottom margin ✓ -->
  <g transform="translate(70, 778)" filter="url(#s4)">
