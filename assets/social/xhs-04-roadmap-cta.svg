          <text x="26" y="46" text-anchor="middle" font-family="Helvetica Neue, Inter, Arial Black, sans-serif"
                font-size="23" font-weight="900" fill="#2a1008">3</text>
          <text x="74" y="34" font-family="Helvetica Neue, Inter, Arial Black, sans-serif"
