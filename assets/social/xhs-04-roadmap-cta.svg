        <text y="114" font-family="Helvetica Neue, Inter, Arial, sans-serif"
              font-size="14" fill="#90a898">· 全部文件在 repo assets/social · 致谢区已列 LHTB / DeepSeek Harness / StepFun 出处</text>
      </g>
    </g>
  </g>
