<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/><stop offset="100%" stop-color="#0b0d14"/>
    </linearGradient>
    <linearGradient id="doneG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1FAA59"/><stop offset="100%" stop-color="#2ea043"/></linearGradient>
    <linearGradient id="nextG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF8A3D"/><stop offset="100%" stop-color="#FF5A1F"/></linearGradient>
    <linearGradient id="goalG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7B5BF2"/><stop offset="100%" stop-color="#8957e5"/></linearGradient>
    <linearGradient id="callG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF5A1F"/><stop offset="100%" stop-color="#FF8A3D"/></linearGradient>
    <filter id="s4"><feDropShadow dx="0" dy="3" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/></filter>
