        <text y="66" font-family="Helvetica Neue, Inter, Arial, sans-serif"
              font-size="15" fill="#a898d0">· 调度策略 + 学习型模型在 OS 内部训练评测 · 不跟业务 agent 混</text>
        <text y="90" font-family="Helvetica Neue, Inter, Arial, sans-serif"
              font-size="15" fill="#a898d0">· 多 agent 多会话并行的调度原语 · 任务队列 + 资源配额 + 优先级抢占</text>
        <text y="114" font-family="Helvetica Neue, Inter, Arial, sans-serif"
              font-size="14" fill="#9888c0">· 让长时程 agent 像进程一样被工程化管理 · 而不只是被提示词糊弄</text>
      </g>
    </g>
  </g>
