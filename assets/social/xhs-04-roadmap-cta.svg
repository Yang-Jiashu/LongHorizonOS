        <text y="38" font-family="Helvetica Neue, Inter, Arial, sans-serif"
              font-size="18" font-weight="600" fill="#a8d0b8">· 单机 · <tspan font-weight="800" fill="#FFFFFF">DeepSeek Harness</tspan> 集成 · 46-task <tspan font-weight="800" fill="#3DD68F">LHTB = LongHorizonBenchmark</tspan> 配对评测</text>
        <text y="66" font-family="Helvetica Neue, Inter, Arial, sans-serif"
