<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0f0c"/>
      <stop offset="50%" stop-color="#0F0F12"/>
      <stop offset="100%" stop-color="#140a1e"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#FF5A1F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF5A1F" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.85" cy="0.15" r="0.5">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF5A1F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.1" cy="0.9" r="0.45">
      <stop offset="0%" stop-color="#6B48FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6B48FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1440" fill="url(#bg)"/>
  <rect width="1080" height="1440" fill="url(#orb1)"/>
  <rect width="1080" height="1440" fill="url(#orb2)"/>

  <!-- Accent line -->
  <rect x="0" y="380" width="1080" height="2" fill="url(#accentGlow)"/>

  <!-- Logo (top-left compact) -->
  <g transform="translate(70, 70)">
    <g transform="scale(0.6)">
      <circle cx="128" cy="128" r="76" fill="none" stroke="#FFFFFF"
              stroke-width="21" stroke-linecap="round"
              stroke-dasharray="350.18 127.34"
              transform="rotate(-42 128 128)"/>
      <path d="M96 130 L124 158 L192 82" fill="none" stroke="#FF5A1F"
            stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="180" y="98" font-family="Helvetica Neue, Inter, Arial, sans-serif"
          font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="1">LongHorizonOS</text>
    <text x="180" y="140" font-family="Helvetica Neue, Inter, Arial, sans-serif"
          font-size="22" fill="#888895" letter-spacing="2">LONG-HORIZON AGENT · OS LAYER</text>
  </g>

  <!-- HOOK headline (giant, center-left bias) -->
  <g transform="translate(70, 470)">
    <text font-family="Helvetica Neue, Inter, Arial, sans-serif"
          font-size="58" font-weight="500" fill="#FFB199" letter-spacing="3">
      做 Agent 的，都见过这种噩梦吧
    </text>
  </g>

  <!-- Giant number block -->
  <g transform="translate(70, 600)" filter="url(#shadow)">
    <text font-family="Helvetica Neue, Inter, Arial Black, sans-serif"
          font-size="172" font-weight="900" fill="#FF5A1F" letter-spacing="-4">
      120M
    </text>
    <text x="10" y="170" font-family="Helvetica Neue, Inter, Arial, sans-serif"
          font-size="42" font-weight="700" fill="#FFFFFF">
      token 烧光了
    </text>
    <text x="10" y="228" font-family="Helvetica Neue, Inter, Arial, sans-serif"
          font-size="40" font-weight="500" fill="#FF5A1F">
      超级马里奥 · 连第一关都没过
    </text>
  </g>

  <!-- Second stat -->
  <g transform="translate(70, 920)">
    <text font-family="Helvetica Neue, Inter, Arial Black, sans-serif"
          font-size="106" font-weight="900" fill="#6B48FF" letter-spacing="-2">18.3万</text>
    <text x="6" y="150" font-family="Helvetica Neue, Inter, Arial, sans-serif"
          font-size="34" font-weight="600" fill="#EAEAF0">/ 次 模型调用的 token 账单</text>
    <text x="6" y="196" font-family="Helvetica Neue, Inter, Arial, sans-serif"
          font-size="28" fill="#888895">158 次续跑 · 3.5 小时 · reward 从 0.292 → 0</text>
  </g>

  <!-- Divider dot -->
  <g transform="translate(70, 1140)">
    <circle cx="8" cy="8" r="8" fill="#FF5A1F"/>
    <text x="38" y="18" font-family="Helvetica Neue, Inter, Arial, sans-serif"
          font-size="26" fill="#888895" letter-spacing="2">IT WASN'T CRASHING. IT WAS *WORKING*.</text>
  </g>

  <!-- Bottom value prop box -->
  <g transform="translate(70, 1200)">
    <rect width="940" height="150" rx="20" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <text x="40" y="66" font-family="Helvetica Neue, Inter, Arial, sans-serif"
          font-size="36" font-weight="700" fill="#FFFFFF">Harness 让 Agent 一直跑</text>
    <text x="40" y="118" font-family="Helvetica Neue, Inter, Arial, sans-serif"
          font-size="36" font-weight="700" fill="#FF5A1F">LongHorizonOS · 让它别白跑</text>
  </g>

</svg>
